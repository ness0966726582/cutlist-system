name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: 規則與匯入匯出測試
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安裝
        run: pip install -r api/requirements.txt pytest ruff
      - name: Lint
        run: ruff check api/app --select E9,F63,F7,F82 --output-format github
      - name: 單元測試 (rules / importer / exporter，不需資料庫)
        run: pytest -q tests

  build:
    name: Docker 映像可建置
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: compose build
        run: docker compose build --quiet
